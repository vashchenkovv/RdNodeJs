services:
  postgres:
    image: postgres:16
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-db}
    ports:
      - '${DB_PORT:-5432}:5432'

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: user@example.com
      PGADMIN_DEFAULT_PASSWORD: securepassword
    ports:
      - '8081:80'
    depends_on:
      - postgres
    networks:
      - internal

  minio:
    env_file:
      - .env.dev
    ports:
      - '9000:9000'
      - '9001:9001'

  minio-init:
    env_file:
      - .env.dev

  api:
    build:
      target: dev
    env_file:
      - .env.dev
    volumes:
      - ./src:/app/src
      - node_modules:/app/node_modules
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json

  migrate:
    env_file:
      - .env.dev

  seed:
    env_file:
      - .env.dev

  rabbitmq:
    ports:
      - '5672:5672'
      - '15672:15672'
      
volumes:
  minio:
  db:
  node_modules: